name: X86-IPv6-Luci23

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 4 * * 5

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/x86v6-luci23.config
  DIY_P1_SH: diy-part1-luci23.sh
  DIY_P2_SH: diy-part2.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
           
    steps:
    - name: 🔍 Check initial disk space
      run: |
        echo "=== Initial Disk Space Status ==="
        df -hT
        echo "=================================="

    - name: 🧹 Deep Clean Disk Space (OpenWrt Optimized)
      run: |
        sudo -E apt-get update -qq
        sudo -E apt-get remove -yqq --purge \
          dotnet* mono* msbuild* powershell* ghc* haskell* \
          android* google-chrome* firefox* codeql* llvm* clang* \
          gcc-11 gcc-11-multilib g++-11 g++-11-multilib \
          libreoffice* thunderbird* mysql* postgresql* mongodb*
        sudo -E apt-get autoremove -yqq --purge
        sudo -E apt-get clean -yqq
        sudo rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/*
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell \
          /usr/local/share/chromium /usr/local/lib/node_modules /var/cache/apt/archives \
          /home/runner/actions-runner/cached/_diag/* /home/runner/work/_temp/*
        sudo swapoff -a && sudo rm -f /swapfile
        sudo mkdir -p /tmp && sudo chmod 777 /tmp
        echo "=== Disk Space After Deep Clean ==="
        df -hT
        echo "=================================="

    - name: Checkout
      uses: actions/checkout@v3.1.0  
                 
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
        mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools \
        libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
        vim wget xmlto xxd zlib1g-dev python3-setuptools
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet \
        /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
        /usr/local/lib/node_modules
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j4
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        make clean && make dirclean
        echo "=== Download Directory Size ==="
        du -sh dl/
        echo "================================"

    - name: Clean compile temp files
      run: |
        cd openwrt
        rm -rf build_dir/tmp* build_dir/host* bin/targets/*/*/packages
        sudo rm -rf /tmp/* || true
        echo "=== Disk Space Before Compile ==="
        df -hT
        echo "=================================="

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        COMPILE_THREADS=$(( $(nproc) - 1 ))
        if [ $COMPILE_THREADS -lt 1 ]; then COMPILE_THREADS=1; fi
        echo "Using $COMPILE_THREADS thread(s) for compile (safe mode)"
        mkdir -p /tmp/openwrt-tmp && sudo chmod 777 /tmp/openwrt-tmp
        make -j$COMPILE_THREADS V=0 LOG_LEVEL=0 TMPDIR=/tmp/openwrt-tmp 2>/dev/null \
          || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        # 这里替换成你的 PAT 密钥 GH_PAT
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
